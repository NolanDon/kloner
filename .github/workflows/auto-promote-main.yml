name: "Auto Promote Development To Main"

on:
  push:
    branches:
      - development

permissions:
  contents: write

concurrency:
  group: "auto-promote-development"
  cancel-in-progress: true

jobs:
  quality-gate:
    name: "quality-gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand --ci --silent

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

  promote-to-main:
    name: "promote-to-main"
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge development into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/development
          git push origin main
