name: "Auto Promote Development To Main"

on:
  push:
    branches:
      - development

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "auto-promote-development"
  cancel-in-progress: true

jobs:
  quality-gate:
    name: "quality-gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand --ci --silent

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

  open-or-update-pr:
    name: "open-or-update-pr"
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Create or update PR and enable auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "development";
            const base = "main";

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
              per_page: 1,
            });

            let pr = existing.data[0];

            if (!pr) {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title: "chore: promote development to main",
                head,
                base,
                body: [
                  "Automated promotion PR from development to main.",
                  "",
                  "This PR is created after lint + tests + typecheck pass on development.",
                ].join("\n"),
                maintainer_can_modify: true,
              });
              pr = created.data;
              core.info(`Created PR #${pr.number}`);
            } else {
              core.info(`Found existing PR #${pr.number}`);
            }

            try {
              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }`,
                { pullRequestId: pr.node_id }
              );
              core.info(`Enabled auto-merge for PR #${pr.number}`);
            } catch (error) {
              core.warning(`Could not enable auto-merge automatically: ${error.message}`);
              core.warning("If needed, enable repo auto-merge in settings and/or branch protection for main.");
            }
