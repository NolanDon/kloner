# .github/workflows/daily-email-sweeps.yml
name: ✉️ Daily Email Sweeps

on:
    schedule:
        # daily 00:15 UTC
        # - cron: "15 0 * * *"

        # Every 5 minutes (UTC) - temp for testing
        - cron: "*/5 * * * *"
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    call-email-sweeps:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Call journey email sweep endpoint
              shell: bash
              env:
                  BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
                  INTERNAL_KEY: ${{ secrets.INTERNAL_API_KEY }}
              run: |
                  set -euo pipefail

                  URL="${BASE_URL%/}/api/private/send-journey-emails"
                  echo "Calling $URL"

                  curl -sSf -X POST "$URL" \
                    -H "content-type: application/json" \
                    -H "x-internal-key: $INTERNAL_KEY" \
                    --data '{}' \
                    && echo "Journey email sweep OK"
