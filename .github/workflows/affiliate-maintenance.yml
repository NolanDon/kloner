# .github/workflows/affiliate-maintenance-daily.yml
name: ♻ Affiliate Maintenance (daily)

on:
  schedule:
    # daily 00:15 UTC
    # - cron: "15 0 * * *" 

    # Every 5 minutes (UTC)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  call-affiliate-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call affiliate maintenance endpoint
        shell: bash
        env:
          BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          HDR_NAME: ${{ secrets.INTERNAL_HEADER_NAME }}
          HDR_VALUE: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          URL="${BASE_URL%/}/app/api/internal/affiliate-maintenance"
          echo "Calling $URL"
          curl -sSf -X POST "$URL" \
            -H "content-type: application/json" \
            -H "$HDR_NAME: $HDR_VALUE" \
            --data '{"limit":200}' \
            && echo "Affiliate maintenance OK"
